name: Release

run-name: ${{ github.event_name == 'pull_request' && 'Test' || 'Release' }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload binaries for, when GoReleaser failed after tagging (vX.Y.Z)
        required: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: release

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # svu reads the Conventional Commits since the last tag: fix → patch, feat → minor,
      # `!` or BREAKING CHANGE → major, anything else → no release.
      - name: Tag the next version
        if: github.event_name == 'push'
        env:
          # svu needs a newer Go than go.mod; let Go fetch that toolchain.
          GOTOOLCHAIN: auto
        run: |
          current=$(go run github.com/caarlos0/svu/v3@v3.4.4 current)
          next=$(go run github.com/caarlos0/svu/v3@v3.4.4 next)
          if [ "$next" != "$current" ]; then
            git tag "$next"
            git push origin "$next"
          fi

      # Same job on purpose: a tag pushed with GITHUB_TOKEN doesn't trigger other workflows.
      - name: Find the release tag
        id: tag
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Build and upload the binaries
        if: steps.tag.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release notes GoReleaser just published, prepended to CHANGELOG.md on main.
      # [skip ci] keeps this commit from starting another run; it's a docs: commit, so it never releases.
      - name: Update CHANGELOG.md
        if: steps.tag.outputs.tag != '' && github.event_name == 'push'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sh .github/scripts/update-changelog.sh "$TAG" "$REPOSITORY"
          if git diff --quiet CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update the changelog for $TAG [skip ci]" CHANGELOG.md
          git pull --rebase origin main
          git push origin HEAD:main
