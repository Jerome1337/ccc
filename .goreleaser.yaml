version: 2
project_name: ccc

builds:
  - main: .
    binary: ccc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

# Raw binaries, named for `ccc update` and install.sh: ccc_darwin_arm64, ccc_linux_amd64…
# No UPX: it would break the ad-hoc signature Go adds to darwin/arm64 binaries.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Release notes, from the Conventional Commits since the previous tag.
changelog:
  use: git
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"
      - "^ci"
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Other changes
      order: 999

release:
  # Lets a rerun from workflow_dispatch upload over a half-finished release.
  replace_existing_artifacts: true
